<style>
/* 90 x 54 mm card with 3 mm bleed on every side -> 96 x 60 mm page.
   Trim is at 3mm; keep anything that must survive the guillotine 4mm inside that. */
:root {
  --bleed: 3mm;
  --w: 90mm;
  --h: 54mm;
  --safe: 7mm;            /* bleed + 4mm safe margin */
  --paper: #f5f1e8;
  --ink: #1b1916;
  --ink-soft: #5d564c;
  --accent: #0f766e;
  --dark: #141210;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@page {
  size: 96mm 60mm;
  margin: 0;
}

html, body { background: #8a8a8a; }

.card {
  position: relative;
  width: 96mm;
  height: 60mm;
  overflow: hidden;
  font-family: "DM Sans", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  page-break-after: always;
  break-after: page;
}

.card:last-child { page-break-after: auto; break-after: auto; }

.card__inner {
  position: absolute;
  inset: var(--safe);
}

/* ---------- front ---------- */

.name {
  font-family: "Space Grotesk", sans-serif;
  font-size: 7.4mm;
  line-height: 1;
  letter-spacing: -0.02em;
  font-weight: 700;
}

.role {
  margin-top: 1.6mm;
  font-size: 3.1mm;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.01em;
}

.rule {
  width: 14mm;
  height: 0.6mm;
  background: var(--accent);
  margin: 3.4mm 0;
}

.lines {
  display: grid;
  gap: 1.5mm;
  font-family: "IBM Plex Mono", monospace;
  font-size: 2.9mm;
  color: var(--ink-soft);
}

.lines b { color: var(--ink); font-weight: 500; }

.front-foot {
  position: absolute;
  right: 0;
  bottom: 0;
  font-family: "IBM Plex Mono", monospace;
  font-size: 2.6mm;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ---------- back ---------- */

.card--back { background: var(--dark); color: var(--paper); }

.card--back .card__inner {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 6mm;
}

.pitch {
  font-family: "Space Grotesk", sans-serif;
  font-size: 5.6mm;
  line-height: 1.18;
  letter-spacing: -0.015em;
  font-weight: 600;
}

.pitch em { font-style: normal; color: #5fd0ae; }

.pitch-note {
  margin-top: 2.6mm;
  font-family: "IBM Plex Mono", monospace;
  font-size: 2.7mm;
  line-height: 1.45;
  color: #a9a299;
}

.qr {
  display: grid;
  justify-items: center;
  gap: 1.6mm;
}

/* Dark modules on a light panel: the orientation every scanner expects.
   Inverted QR works on some phones and fails on others, which is not a gamble
   worth taking on 500 printed cards. */
.qr-plate {
  background: var(--paper);
  padding: 2mm;
  border-radius: 1mm;
  line-height: 0;
}

.qr svg {
  width: 22mm;
  height: 22mm;
  color: var(--dark);           /* the path uses currentColor */
  display: block;
}

.qr span {
  font-family: "IBM Plex Mono", monospace;
  font-size: 2.3mm;
  letter-spacing: 0.06em;
  color: #a9a299;
}

/* Screen-only: show where the card gets cut. Never printed. */
@media screen {
  body { padding: 10mm; display: grid; gap: 8mm; justify-items: center; }
  .card { box-shadow: 0 4mm 12mm rgba(0,0,0,0.35); }
  .card::after {
    content: "";
    position: absolute;
    inset: var(--bleed);
    border: 0.2mm dashed rgba(220, 60, 60, 0.9);
    pointer-events: none;
  }
}
</style>
</head>

    <div class="rule"></div>

</section>
