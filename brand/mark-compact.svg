<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Kunal Varshney">
  <defs>
    <linearGradient id="kvc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E02F6B"/>
    </linearGradient>
  </defs>
  <!-- Small-size variant: fewer, chunkier pixels. Below about 32 px the three-step
       trail turns to mush, so this drops to one satellite and a bigger core. -->
  <g fill="url(#kvc)">
    <rect x="8"  y="14" width="18" height="18" rx="3" opacity=".6"/>
    <rect x="36" y="30" width="52" height="52" rx="8"/>
  </g>
</svg>
