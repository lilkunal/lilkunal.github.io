<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Kunal Varshney">
  <defs>
    <linearGradient id="kv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E02F6B"/>
    </linearGradient>
  </defs>
  <!-- Loose pixels on a single diagonal, growing as they approach: the eye reads
       one direction of travel, so it says "being pulled in" rather than "exploding". -->
  <g fill="url(#kv)">
    <rect x="6"  y="10" width="8"  height="8"  rx="1.5" opacity=".32"/>
    <rect x="18" y="20" width="12" height="12" rx="2"   opacity=".55"/>
    <rect x="31" y="33" width="15" height="15" rx="2.5" opacity=".8"/>
    <rect x="50" y="28" width="40" height="40" rx="6"/>
  </g>
</svg>
